name: Deploy to GitHub Pages (fallback)

# 说明：主部署已迁移到 VPS（见 deploy-vps.yml + deploy/DEPLOYMENT.md）。
# 本工作流保留为「割接期回退杠杆」：只响应手动触发，不再随 push 自动执行。
# 当 VPS 侧出现不可快速修复的故障时，可手动跑一次刷新 gh-pages，
# 再把 DNS 从 A 记录改回 CNAME(*.pages.github.io) 即可整站回退。
# 割接稳定 1-2 周后，可在 Settings → Pages 解除自定义域名并删除本文件。

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 回退原因（记入日志）
        required: false
        default: manual fallback

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 21
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Pre-deploy gate
        run: bash deploy/scripts/check-build.sh build

      # Popular action to deploy to GitHub Pages:
      # Docs: https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-docusaurus
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
