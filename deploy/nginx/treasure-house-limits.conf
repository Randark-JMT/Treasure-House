# http 级共享内存区与访问日志格式（安装到 /etc/nginx/conf.d/zz-treasure-house-limits.conf）
# 静态站点同样会被爬取与 CC，境内 ECS 出口带宽有限，限速是必要的可用性控制。
# 命名带 th_ 前缀，避免与主机上 randark.site / docker / ha 等既有 vhost 冲突。

# 单 IP 请求速率。Docusaurus 首屏会并发拉取数十个 assets，阈值必须留足余量。
limit_req_zone $binary_remote_addr zone=th_req:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=th_conn:10m;

# 只放行真实访客语义的方法；OPTIONS/POST 等对纯静态站没有意义
map $request_method $th_method_reject {
    default        0;
    GET            0;
    HEAD           0;
    POST           1;
    PUT            1;
    PATCH          1;
    DELETE         1;
    TRACE          1;
    OPTIONS        1;
}

log_format th_combined escape=json
    '{'
      '"ts":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"host":"$host",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":$status,'
      '"bytes":$body_bytes_sent,'
      '"rt":$request_time,'
      '"proto":"$server_protocol",'
      '"tls":"$ssl_protocol",'
      '"referer":"$http_referer",'
      '"ua":"$http_user_agent"'
    '}';
