# Treasure-House 安全响应头片段
# 注意 nginx 的 add_header 继承规则：子级 location 只要出现任意 add_header，
# 就会完全丢弃上层（server）的 add_header。因此每个自行设置 add_header 的
# location 都必须重新 include 本文件，否则安全头会在静态资源响应上消失。
#
# 说明：Docusaurus 3 会输出内联 <script>（颜色模式初始化）与内联 style，
# 静态构建无法逐次生成 hash/nonce，故 script-src/style-src 保留 'unsafe-inline'。
# 这是本站已知且刻意接受的偏差，收敛路线见 deploy/DEPLOYMENT.md「加固路线」。

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
