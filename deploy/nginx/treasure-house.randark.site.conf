# Treasure-House · https://treasure-house.randark.site
# 安装到 /etc/nginx/sites-available/treasure-house.randark.site.conf
# 由 deploy/scripts/server-init.sh 完成拷贝、软链、nginx -t 与 reload。
#
# 关键约定：root 指向 releases 原子切换的符号链接，内容部署无需 reload nginx。
#   /var/www/html/treasure-house/current -> /var/www/html/treasure-house/releases/<id>
# 因此这里刻意不开启 open_file_cache：符号链接换向后的可见性必须是即时的，
# 缓存 stat 结果会让新版本在 valid 窗口内仍返回旧文件，破坏回滚的确定性。

# ---------- 80：仅用于 ACME HTTP-01 兜底与跳转 ----------
server {
    listen 80;
    # 确认 ECS 已分配 IPv6 后再打开，否则 reload 时 bind 失败
    # listen [::]:80;
    server_name treasure-house.randark.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：正式站点 ----------
server {
    # 兼容 nginx < 1.25.1；若你的 nginx >= 1.25.1，可改为 `listen 443 ssl;` + 独立的 `http2 on;`
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name treasure-house.randark.site;

    ssl_certificate     /etc/letsencrypt/live/randark.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/randark.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp521r1;
    ssl_session_cache shared:TH_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # 境内服务器访问 LE OCSP 端点常超时，stapling 会持续刷错误日志，默认关闭
    ssl_stapling off;

    root /var/www/html/treasure-house/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    absolute_redirect off;
    port_in_redirect off;

    # 纯静态站不需要请求体，压低上限减少无谓的内存与带宽消耗
    client_max_body_size 16k;
    client_body_buffer_size 16k;

    # 可用性控制：限速触发时先排队（burst）再拒绝，避免误伤首屏并发
    limit_req zone=th_req burst=120 nodelay;
    limit_conn th_conn 32;
    limit_req_status 429;
    limit_conn_status 429;

    access_log /var/log/nginx/treasure-house.randark.site.access.log th_combined buffer=32k flush=5s;
    error_log  /var/log/nginx/treasure-house.randark.site.error.log warn;

    include /etc/nginx/snippets/security-headers.conf;

    if ($th_method_reject) {
        return 405;
    }

    # 纵深防御：root 已是 current，以下路径正常情况下不可达，仍显式拒绝
    location ~ ^/(releases|incoming|shared|logs|\.staging-)/ {
        access_log off;
        return 404;
    }
    location = /activate-release.sh { return 404; }

    # 隐藏文件（.git/.env/.ssh 等），保留 ACME 挑战目录
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 内容哈希资源：文件名即版本，可永久缓存
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # 未加哈希的静态图片：短 TTL，避免改版后长期不一致
    location ^~ /img/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # PDF / 附件：内容已哈希，但单次体积大，给 30 天并保留 revalidate
    location ~* \.(pdf|zip|tar\.gz|7z|png|jpe?g|gif|svg|webp|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
        try_files $uri =404;
    }

    # HTML 一律 no-cache：每次回源校验，发布与回滚立刻对用户可见
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok $hostname\n";
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # gzip：Docusaurus 产物以文本为主，压缩对境内出口带宽收益最大
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/x-font-ttf
        font/opentype
        image/svg+xml;
}
